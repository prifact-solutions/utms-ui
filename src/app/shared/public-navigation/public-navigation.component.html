<header class="ulm-public-header" [class.scrolled]="isScrolled">


    <a class="logo" routerLink="/">
        <img [src]="appLogoPath" alt="Logo">
    </a>
    <nav>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a routerLink="/explore" routerLinkActive="active">Explore</a>
        <a routerLink="/howitworks" routerLinkActive="active">How it works?</a>

    </nav>


    <div *ngIf="allowSignIn">
        <!-- <a class="button text-only">Need Help?</a> -->
        <!-- <a class="button primary black" routerLink="/login">Sign in</a> -->
        <a class="button primary black" (click)="signIn($event)">Sign in</a>

    </div>

</header>
