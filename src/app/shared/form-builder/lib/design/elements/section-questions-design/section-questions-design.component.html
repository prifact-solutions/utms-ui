<div id={{item.settings.uniqueId}} cdkDropList [cdkDropListData]="item.questions" (cdkDropListDropped)="onDrop($event)"
  [cdkDropListConnectedTo]="containerids" [cdkDropListEnterPredicate]="canDrop.bind(this)"
  (cdkDropListExited)="onDropExit($event)" class="question-container">
  <!-- using canDrop.bind(this) due to non availablity of this in canDrop context - https://github.com/angular/components/issues/16718-->
  <div class="no-question-helper-text" *ngIf="item.questions?.length == 0">
    Please drag and drop a static text or a multiple choice question here
  </div>
  <ng-container *ngFor="let question of item.questions;let i= index;">

    <div [ngClass]="question.settings.uniqueId === selected_item_id_in_design_mode? 'highlight' : ''" cdkDrag
      [cdkDragData]="question" appTrackClicks class="question-box draggable">

      <div *ngIf="question.elementType==FormElementType.descriptive" class="item-box ">


        <div class="item-box-header">
          <div cdkDragHandle class="drag-handle">
            <svg width="24px" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z">
              </path>
              <path d="M0 0h24v24H0z" fill="none"></path>
            </svg>
          </div>
          <div class="item-box-title">
            Question: {{getQuestionIndexSection(question.settings.uniqueId) + 1}}
          </div>
          <div class="mark-container">
            <app-mark-display [marks]="question.marks"></app-mark-display>
          </div>
          <div class="item-box-options">
            <a (click)="onClickInside($event, question)"><i class="fas fa-pencil-alt"></i></a>
            <a (click)="removeField(question)" class="delete"
              [ngClass]="question.settings.uniqueId === selected_item_id_in_design_mode? 'highlight' : ''">
              <i class="fas fa-trash-alt"></i>
            </a>
          </div>
          <div>
            <a (click)="question.settings.toggle = !question.settings.toggle" class="expand-arrow"
              [ngClass]="question.settings.toggle? 'down' : 'up'">
            </a>
          </div>
        </div>

        <div *ngIf='!question.settings.toggle' class="item-details">
          <app-text-design [item]='question'></app-text-design>
        </div>

      </div>

      <div *ngIf="question.elementType==FormElementType.file_upload" class="item-box ">


        <div class="item-box-header">
          <div cdkDragHandle class="drag-handle">
            <svg width="24px" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z">
              </path>
              <path d="M0 0h24v24H0z" fill="none"></path>
            </svg>
          </div>
          <div class="item-box-title">
            Question: {{getQuestionIndexSection(question.settings.uniqueId) + 1}}
          </div>
          <div class="mark-container">
            <app-mark-display [marks]="question.marks"></app-mark-display>
          </div>
          <div class="item-box-options">
            <a (click)="onClickInside($event, question)"><i class="fas fa-pencil-alt"></i></a>
            <a (click)="removeField(question)" class="delete"
              [ngClass]="question.settings.uniqueId === selected_item_id_in_design_mode? 'highlight' : ''">
              <i class="fas fa-trash-alt"></i>
            </a>
          </div>
          <div>
            <a (click)="question.settings.toggle = !question.settings.toggle" class="expand-arrow"
              [ngClass]="question.settings.toggle? 'down' : 'up'">
            </a>
          </div>
        </div>

        <div *ngIf='!question.settings.toggle' class="item-details">
          <app-file-upload-design [item]='question'></app-file-upload-design>
        </div>

      </div>

      <div *ngIf="question.elementType==FormElementType.multiple_choice" class="item-box ">

        <div class="item-box-header">
          <div cdkDragHandle class="drag-handle">
            <svg width="24px" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z">
              </path>
              <path d="M0 0h24v24H0z" fill="none"></path>
            </svg>
          </div>
          <div class="item-box-title">
            Question: {{getQuestionIndexSection(question.settings.uniqueId)+ 1}}
          </div>
          <div class="mark-container">
            <app-mark-display [marks]="question.marks"></app-mark-display>
          </div>
          <div class="item-box-options">
            <a (click)="onClickInside($event, question)"><i class="fas fa-pencil-alt"></i></a>
            <a (click)="removeField(question)" class="delete"
              [ngClass]="question.settings.uniqueId === selected_item_id_in_design_mode? 'highlight' : ''">
              <i class="fas fa-trash-alt"></i>
            </a>
          </div>
          <div>
            <a (click)="question.settings.toggle = !question.settings.toggle" class="expand-arrow"
              [ngClass]="question.settings.toggle? 'down' : 'up'">
            </a>
          </div>
        </div>
        <div *ngIf='!question.settings.toggle' class="item-details">
          <app-radio-design [item]='question'></app-radio-design>
        </div>
      </div>
      <div *ngIf="question.elementType==FormElementType.paragraph" class="item-box ">
        <div class="item-box-header">
          <div cdkDragHandle class="drag-handle">
            <svg width="24px" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z">
              </path>
              <path d="M0 0h24v24H0z" fill="none"></path>
            </svg>
          </div>
          <div class="item-box-title">

          </div>
          <div class="item-box-options">
            <a (click)="onClickInside($event, question)"><i class="fas fa-pencil-alt"></i></a>
            <a (click)="removeField(question)" class="delete"
              [ngClass]="question.settings.uniqueId === selected_item_id_in_design_mode? 'highlight' : ''">
              <i class="fas fa-trash-alt"></i>
            </a>
          </div>
          <div>
            <a (click)="question.settings.toggle = !question.settings.toggle" class="expand-arrow"
              [ngClass]="question.settings.toggle? 'down' : 'up'">
            </a>
          </div>
        </div>
        <div class="item-details">
          <app-static-design *ngIf='!question.settings.toggle' [item]='question'></app-static-design>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<lib-confirm [showConfirm]="showDelConfirm" [confirmMessage]="'Are you sure you want to delete this question?'"
  (onPrimaryAction)="delConfirmAction($event)" (onSecondaryAction)="cancelDelAction($event)"></lib-confirm>
