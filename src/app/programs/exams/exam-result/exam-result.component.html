<div class="online-exam-success" *ngIf="!loading">
  <div *ngIf="isExamPassed">
    <div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 48 48"
        width="144px"
        height="144px"
      >
        <path
          fill="#c8e6c9"
          d="M36,42H12c-3.314,0-6-2.686-6-6V12c0-3.314,2.686-6,6-6h24c3.314,0,6,2.686,6,6v24C42,39.314,39.314,42,36,42z"
        />
        <path
          fill="#4caf50"
          d="M34.585 14.586L21.014 28.172 15.413 22.584 12.587 25.416 21.019 33.828 37.415 17.414z"
        />
      </svg>
    </div>
    <div class="alert alert-success">
      <p>Congratulations! You have successfully completed the exam.</p>
      <p>Score: {{ score }}</p>
    </div>
    <div class="success-summary">
      <div>
        <button class="button primary" (click)="next()">Next</button>
      </div>
    </div>
  </div>
  <div *ngIf="!isExamPassed">
    <div class="alert alert-success">
      <p>You did not clear the exam.</p>
      <p>Score: {{ score }}</p>
      <p>Passing score: {{ passing_score }}</p>
    </div>
    <div class="success-summary">
      <div>
        <button class="button primary" (click)="retakeExam()">
          Retake exam
        </button>
      </div>
    </div>
  </div>
</div>
