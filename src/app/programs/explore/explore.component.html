<div class="container mt-4">
    <h2 class="mb-4">Welcome!</h2>
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let program of programs">
            <div class="card h-100">
                <img *ngIf="program.thumbnail" class="card-img-top" [src]="program.thumbnail" alt="{{program.title}}">
                <div class="card-body">
                    <h5 class="card-title">{{program.title}}</h5>
                    <p class="card-text">{{program.description}}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">{{program.duration}} days</small>
                        <span *ngIf="program.is_active" class="badge bg-success">Active</span>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <button *ngIf="!program.is_enrolled" class="btn btn-primary w-100" (click)="enrollProgram(program.id)">Enroll</button>
                    <button *ngIf="program.is_enrolled" class="btn btn-primary w-100" (click)="viewProgram(program.id)">View Program</button>
                </div>
            </div>
        </div>
    </div>
</div>
