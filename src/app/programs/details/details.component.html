<div class="container mt-4">
    <div *ngIf="catalog" class="row">
        <div class="col-md-12">
            <div class="card">
                <img *ngIf="catalog.thumbnail" class="card-img-top" [src]="catalog.thumbnail" alt="{{ catalog.title }}">
                <div class="card-body">
                    <h1 class="card-title">{{ catalog.title }}</h1>
                    <p class="card-text">{{ catalog.description }}</p>
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <h6 class="text-muted">Duration</h6>
                            <p><strong>{{ catalog.duration }} days</strong></p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted">Status</h6>
                            <p><span *ngIf="catalog.is_active" class="badge bg-success">Active</span>
                                <span *ngIf="!catalog.is_active" class="badge bg-secondary">Inactive</span>
                            </p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h6 class="text-muted">Categories</h6>
                        <p *ngIf="catalog.categories.length > 0">{{ catalog.categories.join(', ') }}</p>
                        <p *ngIf="catalog.categories.length === 0" class="text-muted">No categories assigned</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="catalog" class="row mt-5">
        <div class="col-md-12">
            <h2 class="mb-4">Program Catalog</h2>
            
            <!-- Modules List -->
            <div class="modules-list">
                <div *ngFor="let module of catalog.modules; let moduleIdx = index" class="module-section mb-5">
                    <h4 class="module-title">
                        <span class="badge bg-primary me-2">Module {{ module.order }}</span>
                        {{ module.title }}
                    </h4>
                    
                    <!-- Lessons List -->
                    <ul class="lessons-list ms-3">
                        <li *ngFor="let lesson of module.module_contents" class="lesson-item" [ngClass]="'status-' + getStatus(lesson)">
                            <span class="status-marker" [title]="getStatus(lesson)"></span>
                            <a (click)="navigateToLesson(lesson)" class="lesson-link">
                                {{ lesson.title }}
                            </a>
                            <span class="badge bg-info ms-2">{{ lesson.content_type }}</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</div>
