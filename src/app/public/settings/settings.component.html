<div class="dashboard-page settings-page">
    <div class="inner">
        <div class="dashboard-banner">
            <div class="user-details">
                <h1>Account <strong>Settings</strong></h1>
                <p>Customize your experience and manage notification preferences.</p>
            </div>
        </div>

        <div class="container settings-content">
            <section class="section">
                <div class="settings-grid">
                    <div class="settings-card">
                        <h3>Notifications</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <strong>Email Notifications</strong>
                                <p>Receive updates about your enrolled courses</p>
                            </div>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <div class="setting-info">
                                <strong>Course Reminders</strong>
                                <p>Get notified when you have pending lessons</p>
                            </div>
                            <label class="switch">
                                <input type="checkbox" checked>
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-card">
                        <h3>Appearance</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <strong>Dark Mode</strong>
                                <p>Switch between light and dark themes</p>
                            </div>
                            <label class="switch">
                                <input type="checkbox">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>

                    <!-- <div class="settings-card danger-zone">
                        <h3>Danger Zone</h3>
                        <div class="setting-item">
                            <div class="setting-info">
                                <strong>Deactivate Account</strong>
                                <p>Temporarily disable your account</p>
                            </div>
                            <button class="button text-only red">Deactivate</button>
                        </div>
                    </div> -->
                </div>
            </section>
        </div>
    </div>
</div>
