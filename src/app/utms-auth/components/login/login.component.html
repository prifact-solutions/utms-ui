<div class="auth-page">
  <div>
    <div class="auth-header">
      <div>
        <h2><strong> Welcome to</strong> UPSKILL CRS</h2>
        <p>Sign in to your account to continue</p>
      </div>
      <div>
        <svg width="75px" height="75px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M4 21V19.5C4 16.4624 6.46243 14 9.5 14H14.5C17.5376 14 20 16.4624 20 19.5V21M8 21V18.5M16 21V18.3333M8.5 6.5C10.514 8.22631 13.486 8.22631 15.5 6.5M16 7V4.92755L17.4657 2.78205C17.6925 2.45018 17.4548 2 17.0529 2H6.94712C6.5452 2 6.30755 2.45018 6.53427 2.78205L8 4.92755V7M16 8C16 10.2091 14.2091 12 12 12C9.79086 12 8 10.2091 8 8V5.5H16V8Z"
              stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"></path>
          </g>
        </svg>
      </div>
    </div>
    <div class="auth-card">


      <div *ngIf="errorMessage" class="alert-error">
        <div>
          <strong>Login Failed:</strong>
          <div>
            {{ errorMessage }}
          </div>
        </div>
        <button type="button" class="btn-close" (click)="errorMessage = ''">✕</button>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" formControlName="username" placeholder="Enter your username"
            [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" />
          <div class="invalid-feedback"
            *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            <small *ngIf="loginForm.get('username')?.errors?.['required']">Username is required</small>
            <small *ngIf="loginForm.get('username')?.errors?.['minlength']">Username must be at least 3
              characters</small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Enter your password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />
          <div class="invalid-feedback"
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</small>
            <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6
              characters</small>
          </div>
        </div>
        <div class="button-group">
          <button type="submit" class="button primary " [disabled]="loginForm.invalid || isLoading">
            <span *ngIf="!isLoading">Sign In</span>
            <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center">
              <span class="button-loader" aria-hidden="true"></span>
              Signing in...
            </span>
          </button>
        </div>
        <div class="auth-footer">
          <p>Don't have an account? <a href="#">Sign up</a></p>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
