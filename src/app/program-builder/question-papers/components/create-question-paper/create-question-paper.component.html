<div class="secondary-page-content-wrapper">
	<div class="qp-page-heading">
		Create Question Paper
	</div>
	<div class="empty-text" *ngIf="loading">
		Loading ...
	</div>
	<div class="create-qp-div" *ngIf="!loading">
		<div>
			<label class="title-label" for="title">Title<span class="required"> *</span></label>
			<input class="title-input" type="text" placeholder="Question paper title" name="title" [(ngModel)]="title" required>
		</div>

		<div class="btn-holder">
			<button class="primary" (click)="saveQP()">Save</button>
			<button (click)="onCancel()">Cancel</button>
		</div>
	</div>
</div>
