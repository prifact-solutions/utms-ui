<div class="p-wrapper" style="max-width: 600px;">
	<div class="p-heading">
		<h2>Create Question Paper</h2>
	</div>
	<div class="empty-text" *ngIf="loading">
		Loading ...
	</div>
	<div class="form-wrapper" *ngIf="!loading">
		<div class="form-group">
			<label class="title-label" for="title">Title<span class="required"> *</span></label>
			<input class="title-input" type="text" placeholder="Question paper title" name="title" [(ngModel)]="title"
				required>
		</div>

		<div class="button-group">

			<button class="button" (click)="onCancel()">Cancel</button>
			<button class="button primary" (click)="saveQP()">Save</button>
		</div>
	</div>
</div>
