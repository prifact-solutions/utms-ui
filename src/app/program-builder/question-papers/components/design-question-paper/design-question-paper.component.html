<div>
  <div class="nodata" *ngIf="loading">Loading ...</div>
  <div *ngIf="!loading && qpId">
    <app-form-designer
      [qpId]="qpId"
      (back)="onBack($event)"
      (save)="onSave($event)"
      [selectedQuestionTypes]="questionTypes"
      [isReadOnly]="isReadOnly"
    ></app-form-designer>
  </div>
</div>
