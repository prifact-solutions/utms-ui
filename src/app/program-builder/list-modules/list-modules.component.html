<div class="container mt-4">
    <div *ngIf="program" class="row">
        <div class="col-md-12">
            <div class="card">
                <img *ngIf="program.thumbnail" class="card-img-top" [src]="program.thumbnail" alt="{{ program.title }}">
                <div class="card-body">
                    <h1 class="card-title">{{ program.title }}</h1>
                    <p class="card-text">{{ program.description }}</p>
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <h6 class="text-muted">Duration</h6>
                            <p><strong>{{ program.duration }} days</strong></p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted">Status</h6>
                            <p><span *ngIf="program.is_active" class="badge bg-success">Active</span>
                                <span *ngIf="!program.is_active" class="badge bg-secondary">Inactive</span>
                            </p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h6 class="text-muted">Categories</h6>
                        <p *ngIf="program.categories.length > 0">{{ program.categories.join(', ') }}</p>
                        <p *ngIf="program.categories.length === 0" class="text-muted">No categories assigned</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="modules">
        <div class="module-actions-header">
            <a [routerLink]="['/','programs-builder',program?.id,'modules', 'add']" class="btn btn-primary">Add new module</a>
            <a [routerLink]="['/','programs-builder',program?.id,'organize-contents']" class="btn btn-secondary">Organize Contents</a>
        </div>
        <div *ngFor="let module of modules" class="module-card">
            <div class="module-content">
                <h3>{{ module.title }}</h3>

                <div class="module-actions">
                    <button class="btn-edit" [routerLink]="['/programs-builder', program?.id, 'modules', module.id, 'edit']">Edit</button>
                    <button class="btn-delete">Delete</button>
                    <button class="btn-view"
                        [routerLink]="['/','programs-builder',program?.id,'modules', module.id,'lessons']">Manage
                        module contents</button>
                </div>
            </div>
        </div>
    </div>
</div>
