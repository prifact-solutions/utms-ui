<div class="container mt-4">
    <div *ngIf="program" class="row">
        <div class="col-md-12">
            <div class="card">
                <img *ngIf="program.thumbnail" class="card-img-top" [src]="program.thumbnail" alt="{{ program.title }}">
                <div class="card-body">
                    <h1 class="card-title">{{ program.title }}</h1>
                    <p class="card-text">{{ program.description }}</p>
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <h6 class="text-muted">Duration</h6>
                            <p><strong>{{ program.duration }} days</strong></p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted">Status</h6>
                            <p><span *ngIf="program.is_active" class="badge bg-success">Active</span>
                                <span *ngIf="!program.is_active" class="badge bg-secondary">Inactive</span>
                            </p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h6 class="text-muted">Categories</h6>
                        <p *ngIf="program.categories.length > 0">{{ program.categories.join(', ') }}</p>
                        <p *ngIf="program.categories.length === 0" class="text-muted">No categories assigned</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="module" class="row">
        <div class="col-md-12">
            <div class="card">

                <div class="card-body">
                    <h1 class="card-title">{{ module.title }}</h1>

                </div>
            </div>
        </div>
    </div>
    <div *ngIf="module && module_contents">
        <a [routerLink]="['/','programs-builder',program?.id,'modules', module.id, 'lessons','add']">Add new lesson</a> <br/>
        <a [routerLink]="['/','programs-builder',program?.id,'modules', module.id, 'exams','add']">Add new exam</a>
        <div *ngFor="let module_content of module_contents" class="module-card">
            <div class="module-content">
                <h3>{{ module_content.title }}</h3>

                <div class="module-actions">
                    <button class="btn-edit">Edit</button>
                    <button class="btn-delete" (click)="onDelete(module_content.id)">Delete</button>
                    <button class="btn-view" *ngIf="module_content.content_type=='LESSON'"
                        [routerLink]="['/','programs-builder',program?.id,'modules', module.id,'lessons',module_content.id]">Manage Lesson</button>
                        <button class="btn-view" *ngIf="module_content.content_type=='EXAM'"
                        [routerLink]="['/','programs-builder',program?.id,'modules', module.id,'exams',module_content.id]">Manage Exam</button>
                </div>
            </div>
        </div>
    </div>
</div>
