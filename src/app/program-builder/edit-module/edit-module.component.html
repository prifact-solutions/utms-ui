<div class="container mt-4">
    <div *ngIf="isLoading" class="loading">
        <p>Loading module...</p>
    </div>

    <div *ngIf="!isLoading && program" class="row">
        <div class="col-md-12">
            <div class="card">
                <img *ngIf="program.thumbnail" class="card-img-top" [src]="program.thumbnail" alt="{{ program.title }}">
                <div class="card-body">
                    <h1 class="card-title">{{ program.title }}</h1>
                    <p class="card-text">{{ program.description }}</p>
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <h6 class="text-muted">Duration</h6>
                            <p><strong>{{ program.duration }} days</strong></p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted">Status</h6>
                            <p><span *ngIf="program.is_active" class="badge bg-success">Active</span>
                                <span *ngIf="!program.is_active" class="badge bg-secondary">Inactive</span>
                            </p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <h6 class="text-muted">Categories</h6>
                        <p *ngIf="program.categories.length > 0">{{ program.categories.join(', ') }}</p>
                        <p *ngIf="program.categories.length === 0" class="text-muted">No categories assigned</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="!isLoading" class="row">
        <div class="col-md-12">
            <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
            </div>

            <div *ngIf="errorMessage" class="alert alert-error">
                {{ errorMessage }}
            </div>

            <form [formGroup]="moduleForm" (ngSubmit)="onSubmit()" class="p-4 border rounded">
                <h3>Edit Module</h3>

                <!-- Module Title -->
                <div class="mb-3">
                    <label class="form-label">Module Title</label>
                    <input type="text" class="form-control" formControlName="title" placeholder="Enter module title" />
                    <div class="text-danger" *ngIf="f.title.touched && f.title.invalid">
                        Title is required
                    </div>
                </div>

                <!-- Order -->
                <div class="mb-3">
                    <label class="form-label">Order</label>
                    <input type="number" class="form-control" formControlName="order" placeholder="Display order" />
                    <div class="text-danger" *ngIf="f.order.touched && f.order.invalid">
                        Order must be a number
                    </div>
                </div>

                <!-- Submit -->
                <button class="btn btn-primary" [disabled]="moduleForm.invalid || isSubmitting">
                    <span *ngIf="!isSubmitting">Update Module</span>
                    <span *ngIf="isSubmitting">Updating...</span>
                </button>

            </form>
        </div>
    </div>

</div>
