<div [class.admin-page-container]="false" [class.container]="false" >
    <div [class.builder-layout]="false">
        
        <!-- Main Content: Edit Module Form -->
        <main [class.builder-main]="false">
            
            <div *ngIf="successMessage" class="alert-success-compact mb-4">
                {{ successMessage }}
            </div>

            <div *ngIf="errorMessage" class="alert-error-compact mb-4">
                {{ errorMessage }}
            </div>

            <div>

                <div *ngIf="isLoading" class="text-loading">

                    Loading module data..
                </div>
                <form *ngIf="!isLoading" [formGroup]="moduleForm" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label for="moduleTitle">Module Title<span class="required-indicator">*</span></label>
                        <input type="text" id="moduleTitle" formControlName="title"
                            placeholder="e.g. Introduction to Advanced Concepts"
                            [class.is-invalid]="f.title.touched && f.title.invalid">
                        <div class="invalid-feedback" *ngIf="f.title.touched && f.title.invalid">
                            Title is required
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="moduleOrder">Display Order<span class="required-indicator">*</span></label>
                        <input type="number" id="moduleOrder" formControlName="order"
                            placeholder="Enter position (e.g. 1)"
                            [class.is-invalid]="f.order.touched && f.order.invalid">
                        <div class="invalid-feedback" *ngIf="f.order.touched && f.order.invalid">
                            Order must be a positive number
                        </div>
                    </div>

                    <div class="form-actions mt-5">
                        <button type="button" class="button"
                            (click)="closed.emit()">Cancel</button>
                        <button type="submit" class="button primary" [disabled]="moduleForm.invalid || isSubmitting">
                            <span *ngIf="isSubmitting" class="button-loader" aria-hidden="true"></span>
                            <span class="button-loader-label">{{ isSubmitting ? 'Updating...' : 'Update Module' }}</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
