<div class="admin-page-container container" *ngIf="program">
    <div class="builder-layout">
        <!-- Sidebar: Program Info -->
        <aside class="builder-sidebar">
            <div class="program-mini-card card">
                <app-program-featured-media [program]="program" media_type="IMAGE"></app-program-featured-media>
                <div class="p-4">
                    <h4>{{ program.title }}</h4>
                    <p class="text-muted small">{{ program.description | slice:0:100 }}...</p>
                </div>
            </div>
            <nav class="sidebar-nav mt-4">
                <a [routerLink]="['/programs-builder', program.id, 'modules']">⬅ Back to Modules</a>
                <a class="active">Add Module</a>
            </nav>
        </aside>

        <!-- Main Content: Create Module Form -->
        <main class="builder-main">
            <header class="page-header">
                <div class="header-text">
                    <h1>Add New Module</h1>
                    <p class="text-muted">Create a new section for your program curriculum.</p>
                </div>
            </header>

            <div class="card p-5">
                <form [formGroup]="moduleForm" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label for="moduleTitle">Module Title</label>
                        <input type="text" id="moduleTitle" formControlName="title"
                            placeholder="e.g. Introduction to Advanced Concepts"
                            [class.is-invalid]="f.title.touched && f.title.invalid">
                        <div class="invalid-feedback" *ngIf="f.title.touched && f.title.invalid">
                            Title is required
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="moduleOrder">Display Order</label>
                        <input type="number" id="moduleOrder" formControlName="order"
                            placeholder="Enter position (e.g. 1)"
                            [class.is-invalid]="f.order.touched && f.order.invalid">
                        <div class="invalid-feedback" *ngIf="f.order.touched && f.order.invalid">
                            Order must be a positive number
                        </div>
                    </div>

                    <div class="form-actions mt-5">
                        <button type="button" class="btn-outline"
                            [routerLink]="['/programs-builder', program.id, 'modules']">Cancel</button>
                        <button type="submit" class="btn-primary" [disabled]="moduleForm.invalid">
                            Create Module
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
